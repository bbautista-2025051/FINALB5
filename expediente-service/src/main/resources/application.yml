server:
  port: 8085
  shutdown: graceful

spring:
  application:
    name: expediente-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/vet_expedientes_in5am?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:vet}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: expediente-service-hikari
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: 3000
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc.time_zone: UTC
        order_inserts: true
        order_updates: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

springdoc:
  api-docs.path: /v3/api-docs
  swagger-ui.path: /swagger-ui.html

management:
  endpoints.web.exposure.include: health,info,metrics
  endpoint.health.probes.enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Expedientes clinicos

veterinaria:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: ${JWT_EXPIRATION:3600000}
    internal-key: ${INTERNAL_SERVICE_KEY}
  clients:
    cita-service:
      base-url: ${CITA_SERVICE_URL:http://localhost:8084}
    mascota-service:
      base-url: ${MASCOTA_SERVICE_URL:http://localhost:8083}
    connect-timeout-ms: 2000
    read-timeout-ms: 5000

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-}]"
  level:
    com.veterinaria: INFO
    org.hibernate.SQL: ${LOG_SQL:WARN}