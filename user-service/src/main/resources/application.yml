server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/vet_usuarios_in5am?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8mb4&rewriteBatchedStatements=true
    username: ${DB_USERNAME:vet}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: user-service-hikari
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: 3000
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    defer-datasource-initialization: true
    properties:
      hibernate:
        jdbc.time_zone: UTC
        order_inserts: true
        order_updates: true
  sql:
    init:
      mode: always
      continue-on-error: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

springdoc:
  api-docs.path: /v3/api-docs
  swagger-ui.path: /swagger-ui.html

management:
  endpoints.web.exposure.include: health,info,metrics
  endpoint.health.probes.enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Gestion de usuarios de la clinica

veterinaria:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: ${JWT_EXPIRATION:3600000}
    internal-key: ${INTERNAL_SERVICE_KEY}


logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-}]"
  level:
    com.veterinaria: INFO
    org.hibernate.SQL: ${LOG_SQL:WARN}