services:
  mysql:
    image: mysql:8.4
    container_name: vet-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: vet_usuarios_in5am
      MYSQL_USER: ${DB_USERNAME:-vet}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: vet-gateway
    ports:
      - "${GATEWAY_PORT:-8090}:8090"
    environment:
      AUTH_SERVICE_URI: http://auth-service:8081
      USER_SERVICE_URI: http://user-service:8082
      MASCOTA_SERVICE_URI: http://mascota-service:8083
      CITA_SERVICE_URI: http://cita-service:8084
      EXPEDIENTE_SERVICE_URI: http://expediente-service:8085
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:3000}
    depends_on:
      - auth-service
      - user-service
      - mascota-service
      - cita-service
      - expediente-service
    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: vet-auth
    environment:
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (min 32 caracteres)}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Define INTERNAL_SERVICE_KEY en .env}
      USER_SERVICE_URL: http://user-service:8082
    depends_on:
      - user-service
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: vet-usuarios
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USERNAME: ${DB_USERNAME:-vet}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (min 32 caracteres)}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Define INTERNAL_SERVICE_KEY en .env}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mascota-service:
    build:
      context: .
      dockerfile: mascota-service/Dockerfile
    container_name: vet-mascotas
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USERNAME: ${DB_USERNAME:-vet}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (min 32 caracteres)}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Define INTERNAL_SERVICE_KEY en .env}
      USER_SERVICE_URL: http://user-service:8082
    depends_on:
      mysql:
        condition: service_healthy
      user-service:
        condition: service_started
    restart: unless-stopped

  cita-service:
    build:
      context: .
      dockerfile: cita-service/Dockerfile
    container_name: vet-citas
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USERNAME: ${DB_USERNAME:-vet}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (min 32 caracteres)}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Define INTERNAL_SERVICE_KEY en .env}
      USER_SERVICE_URL: http://user-service:8082
      MASCOTA_SERVICE_URL: http://mascota-service:8083
    depends_on:
      mysql:
        condition: service_healthy
      user-service:
        condition: service_started
      mascota-service:
        condition: service_started
    restart: unless-stopped

  expediente-service:
    build:
      context: .
      dockerfile: expediente-service/Dockerfile
    container_name: vet-expedientes
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USERNAME: ${DB_USERNAME:-vet}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (min 32 caracteres)}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Define INTERNAL_SERVICE_KEY en .env}
      MASCOTA_SERVICE_URL: http://mascota-service:8083
      CITA_SERVICE_URL: http://cita-service:8084
    depends_on:
      mysql:
        condition: service_healthy
      mascota-service:
        condition: service_started
      cita-service:
        condition: service_started
    restart: unless-stopped

volumes:
  mysql-data:
